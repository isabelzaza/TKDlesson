<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKD Class Planner</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e8e8e8;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .header-logo {
            text-align: center;
            margin-bottom: 16px;
        }

        .logo {
            width: 120px;
            height: auto;
            border-radius: 50%;
        }

        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 8px;
            font-size: 1.8rem;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        /* Setup Panel */
        .setup-panel {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .option-group {
            margin-bottom: 20px;
        }

        .option-group:last-child {
            margin-bottom: 0;
        }

        .option-label {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .button-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .option-btn {
            padding: 10px 20px;
            border: 2px solid #444;
            background: transparent;
            color: #ccc;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .option-btn:hover {
            border-color: #666;
            color: #fff;
        }

        .option-btn.selected {
            border-color: #e63946;
            background: rgba(230, 57, 70, 0.2);
            color: #fff;
        }

        /* Generate Button */
        .generate-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #e63946 0%, #c1121f 100%);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 24px;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(230, 57, 70, 0.4);
        }

        .generate-btn:active {
            transform: translateY(0);
        }

        /* Plan Display */
        .plan-container {
            display: none;
        }

        .plan-container.visible {
            display: block;
        }

        .plan-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .plan-title {
            font-size: 1.2rem;
            color: #fff;
        }

        .plan-meta {
            font-size: 0.85rem;
            color: #888;
        }

        .refresh-btn {
            padding: 8px 16px;
            background: rgba(255,255,255,0.1);
            border: 1px solid #444;
            border-radius: 6px;
            color: #ccc;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            background: rgba(255,255,255,0.15);
            border-color: #666;
            color: #fff;
        }

        /* Activity Cards */
        .activity-card {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin-bottom: 12px;
            overflow: hidden;
            border-left: 4px solid #e63946;
        }

        .activity-card.push-zone {
            border-left-color: #f4a261;
        }

        .activity-main {
            padding: 16px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .activity-main:hover {
            background: rgba(255,255,255,0.03);
        }

        .activity-name {
            font-size: 1.05rem;
            font-weight: 500;
        }

        .activity-category {
            font-size: 0.8rem;
            color: #888;
            margin-top: 4px;
        }

        .activity-time {
            font-size: 0.85rem;
            color: #aaa;
            white-space: nowrap;
            margin-left: 16px;
        }

        .expand-icon {
            color: #666;
            margin-left: 12px;
            transition: transform 0.2s;
        }

        .activity-card.expanded .expand-icon {
            transform: rotate(180deg);
        }

        .activity-details {
            display: none;
            padding: 0 20px 16px 20px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .activity-card.expanded .activity-details {
            display: block;
        }

        .detail-section {
            margin-top: 12px;
        }

        .detail-label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .detail-content {
            font-size: 0.9rem;
            color: #ccc;
            line-height: 1.5;
        }

        .detail-content ul {
            margin-left: 16px;
            margin-top: 4px;
        }

        .detail-content li {
            margin-bottom: 4px;
        }

        .push-badge {
            display: inline-block;
            background: rgba(244, 162, 97, 0.2);
            color: #f4a261;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 10px;
            text-transform: uppercase;
        }

        /* Total time */
        .total-time {
            text-align: center;
            padding: 16px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            margin-top: 16px;
            color: #888;
        }

        .total-time strong {
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-logo">
            <img src="unic.jpg" alt="Unicorn TKD Logo" class="logo">
        </div>
        <h1>TKD Class Planner</h1>
        <p class="subtitle">Generate a balanced training plan</p>

        <div class="setup-panel">
            <div class="option-group">
                <div class="option-label">Duration</div>
                <div class="button-row">
                    <button class="option-btn" data-group="duration" data-value="30">30 min</button>
                    <button class="option-btn selected" data-group="duration" data-value="60">60 min</button>
                    <button class="option-btn" data-group="duration" data-value="90">90 min</button>
                </div>
            </div>

            <div class="option-group">
                <div class="option-label">Group</div>
                <div class="button-row">
                    <button class="option-btn" data-group="group" data-value="kids">Kids (white–black)</button>
                    <button class="option-btn selected" data-group="group" data-value="adults">Adults (BB–4th dan)</button>
                    <button class="option-btn" data-group="group" data-value="mixed">Mixed</button>
                </div>
            </div>

            <div class="option-group">
                <div class="option-label">Class Size</div>
                <div class="button-row">
                    <button class="option-btn selected" data-group="size" data-value="small">Small (2–6)</button>
                    <button class="option-btn" data-group="size" data-value="medium">Medium (7–15)</button>
                </div>
            </div>
        </div>

        <button class="generate-btn" id="generateBtn">Generate Plan</button>

        <div class="plan-container" id="planContainer">
            <div class="plan-header">
                <div>
                    <div class="plan-title">Your Class Plan</div>
                    <div class="plan-meta" id="planMeta"></div>
                </div>
                <button class="refresh-btn" id="refreshBtn">↻ Refresh</button>
            </div>
            <div id="activitiesList"></div>
            <div class="total-time" id="totalTime"></div>
        </div>
    </div>

    <script src="activities.js?v=4"></script>
    <script src="planner.js?v=4"></script>
</body>
</html>
